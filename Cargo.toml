[package]
name = "mechanix-keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
mecha-wayland = { path = "../mecha-wayland" }
app           = { path = "../mecha-wayland/crates/app" }
wayland       = { path = "../mecha-wayland/crates/wayland" }

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10.7"
xkbcommon = { version = "0.9.0", features = ["wayland"] }
rustix = { version = "1.1.4", features = ["fs", "mm"] }
